<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="omni-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark slate background squircle -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#0f172a" stroke="url(#omni-grad)" stroke-width="1.5" />

  <!-- Center emblem / stylized wrench-omni glyph -->
  <g filter="url(#glow)">
    <!-- Outer Ring -->
    <circle cx="16" cy="16" r="8.5" fill="none" stroke="url(#omni-grad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Omni Core Spark -->
    <circle cx="16" cy="16" r="3" fill="#06b6d4" />
    <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
    
    <!-- Accent Spark Dots -->
    <circle cx="16" cy="4.5" r="1.2" fill="#10b981" />
    <circle cx="27.5" cy="16" r="1.2" fill="#06b6d4" />
  </g>
</svg>
